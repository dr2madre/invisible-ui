name: CI

# Per-PR quality gate. Every non-browser check lives in scripts/gate.mjs and
# runs from there, here and locally (`pnpm gate`), so the two can never
# drift: scripts/gate.test.mjs fails if this workflow runs anything else.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Full history: the changeset gate diffs the PR against its base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same entry point a contributor runs. The changeset step compares
      # against the PR's base; on a manual run there is none and it is skipped.
      - name: Gate
        run: pnpm gate
        env:
          DS_GATE_BASE: ${{ github.event.pull_request.base.sha }}
