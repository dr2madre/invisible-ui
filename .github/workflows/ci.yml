name: CI

# Per-PR quality gate: lint + format check, then builds the whole graph (incl.
# the docs site), runs the vitest suites and the type checks.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # The token registry the docs catalog reads is generated from the
      # stylesheet: this fails if it is stale, if the adapters drift apart, or
      # if a documented value no longer matches the source.
      - name: Token registry drift
        run: pnpm tokens:check

      # `build` includes the Astro docs build; `test` runs vitest + vitest-axe;
      # `check` is svelte-check over the components (types plus a11y).
      - name: Build, test, typecheck
        run: pnpm exec turbo run build test typecheck check

      # The public API report is generated from the built declarations: this
      # fails when an export, a signature or an export map changed without the
      # committed report changing with it.
      - name: Public API report drift
        run: pnpm api:report:check

      # Bundle-size budget (reads the freshly built dist; see .size-limit.json).
      - name: Bundle size budget
        run: pnpm size
