name: CI

# The quality gate. Every non-browser check lives in scripts/gate.mjs and runs
# from there, here and locally (`pnpm gate`). scripts/gate.test.mjs holds this
# file to one job with these five steps and nothing else.
#
# It runs on pull requests and again on `main`: a branch can be green and the
# merge still red, and without the second run nobody sees it.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Full history: the changeset gate diffs the PR against its base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same entry point a contributor runs. The changeset step compares
      # against the PR's base; without a pull request there is none, so that
      # one step is skipped and the rest still run.
      - name: Gate
        run: pnpm gate
        env:
          DS_GATE_BASE: ${{ github.event.pull_request.base.sha }}
