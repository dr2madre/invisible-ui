name: Release

# DORMANT until you choose to publish. Runs only when triggered manually
# (Actions tab → Release → Run workflow). To go live later:
#   1. Remove `private: true` from core/package.json and packages/svelte/package.json
#      (the packages already use the @invisible-ui scope: register the invisible-ui organisation on npm first).
#   2. Add the repo secret NPM_TOKEN (npm automation token with publish rights).
#   3. Enable Settings → Actions → "Allow GitHub Actions to create and approve
#      pull requests".
#   4. Switch the trigger below back to `push: branches: [main]`.
#
# With pending changesets it opens a "Version Packages" PR (bumps + CHANGELOGs);
# merging that publishes the changed packages. Provenance needs `id-token: write`.

on:
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the packed core package as a consumer
        run: |
          pnpm exec turbo run build --filter=@invisible-ui/core
          pnpm --filter @invisible-ui/core run smoke

      - name: Create release PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
