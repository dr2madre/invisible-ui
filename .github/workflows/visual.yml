name: Visual regression

# Pixel-diff the styled component demos against committed baselines.
#
# Runs inside the pinned Playwright container so font/anti-aliasing rendering is
# deterministic (the reason this is opt-in rather than part of the per-PR gate:
# baselines are OS/-image-specific). To (re)generate the authoritative baselines,
# dispatch this workflow with `update: true`: it pushes the refreshed snapshots
# to the `test/visual-baselines` branch, ready for a pull request. See
# docs/visual-testing.md.

on:
  workflow_dispatch:
    inputs:
      update:
        description: "Regenerate baselines and upload them as an artifact"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm exec turbo run build --filter=@design-system/docs

      - name: Compare against baselines
        if: ${{ !inputs.update }}
        run: pnpm visual

      # Demos that animate on their own (progress, meter) never produce two
      # identical consecutive screenshots, so update mode reports them as
      # failed while every stable demo still gets its refreshed snapshot.
      # Keep going: the push step publishes what regenerated; the report
      # artifact carries the unstable ones for inspection.
      - name: Regenerate baselines
        if: ${{ inputs.update }}
        continue-on-error: true
        run: pnpm visual:update

      - name: Push regenerated baselines to the test/visual-baselines branch
        if: ${{ inputs.update }}
        run: |
          git config user.name "dr2madre"
          git config user.email "48051639+dr2madre@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git diff --quiet -- e2e/visual.spec.ts-snapshots/ && \
             [ -z "$(git status --porcelain e2e/visual.spec.ts-snapshots/)" ]; then
            echo "Baselines unchanged; nothing to push."
            exit 0
          fi
          git checkout -B test/visual-baselines
          git add e2e/visual.spec.ts-snapshots/
          git commit -m "test(visual): refresh baselines from the pinned container"
          git push --force origin test/visual-baselines

      - name: Upload report (diffs on failure)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: playwright-report/
          retention-days: 7
