name: Visual regression

# Pixel-diff the styled components of every adapter against committed
# baselines: the Svelte demos on the docs site, and the Elements, Vue and React
# visual pages the Vue example serves.
#
# Runs inside the pinned Playwright container so font/anti-aliasing rendering is
# deterministic (the reason this is opt-in rather than part of the per-PR gate:
# baselines are OS/-image-specific). To (re)generate the authoritative baselines,
# dispatch this workflow with `update: true`: it pushes the refreshed snapshots
# to the `test/visual-baselines` branch, ready for a pull request. See
# docs/visual-testing.md.

on:
  workflow_dispatch:
    inputs:
      update:
        description: "Regenerate baselines and upload them as an artifact"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build both sites Playwright's web servers serve: the docs and the Vue
      # example, which also serves the Elements, Vue and React visual pages
      # (its preview refuses to start without a dist).
      - name: Build docs and the Vue example
        run: >
          pnpm exec turbo run build
          --filter=@design-system/docs
          --filter=@design-system/example-vue

      - name: Compare against baselines
        if: ${{ !inputs.update }}
        run: pnpm visual

      - name: Regenerate baselines
        if: ${{ inputs.update }}
        run: pnpm visual:update

      - name: Push regenerated baselines to the test/visual-baselines branch
        if: ${{ inputs.update }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "dr2madre"
          git config user.email "48051639+dr2madre@users.noreply.github.com"
          # Every visual spec's folder: the Svelte one and one per adapter.
          snapshots=':(glob)e2e/visual*.spec.ts-snapshots/**'
          if [ -z "$(git status --porcelain --untracked-files=all -- "$snapshots")" ]; then
            echo "Baselines unchanged; nothing to push."
            exit 0
          fi
          git checkout -B test/visual-baselines
          git add -- "$snapshots"
          git commit -m "test(visual): refresh baselines from the pinned container"
          git push --force origin test/visual-baselines

      - name: Upload report (diffs on failure)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-report
          path: playwright-report/
          retention-days: 7
