name: E2E

# Real-browser end-to-end tests (Playwright) against the built docs site.
# Separate from the unit gate because it installs a browser.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds the sites Playwright serves: the docs (core + svelte) and the
      # Vue example, whose harness page carries the Vue adapter tests.
      - name: Build the served sites
        run: >
          pnpm exec turbo run build
          --filter=@invisible-ui/docs
          --filter=@invisible-ui/example-vue

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E
        run: pnpm exec playwright test --project=${{ matrix.browser }}

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  # Preserve the required `e2e` status while the browser jobs fan out. This
  # aggregator passes only when every matrix entry succeeds.
  e2e:
    name: e2e
    if: ${{ always() }}
    needs: browser
    runs-on: ubuntu-latest
    steps:
      - name: Confirm browser matrix passed
        env:
          RESULT: ${{ needs.browser.result }}
        run: test "$RESULT" = "success"
