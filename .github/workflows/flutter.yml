  workflow_dispatch:
    inputs:
      update-goldens:
        description: "Regenerate the golden images and push them to test/flutter-golden-images"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/flutter

jobs:
  flutter:
    name: Flutter (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lower bound
            channel: stable
            version: 3.35.7
            analyze: lib test
          - name: stable
            channel: stable
            version: ""
            analyze: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: ${{ matrix.channel }}
          flutter-version: ${{ matrix.version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Formatting follows the package's language version (3.9), so both
      # versions agree; it runs once.
      - name: Format
        if: matrix.name == 'lower bound'
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze ${{ matrix.analyze }}

      - name: Test
        run: flutter test --exclude-tags golden

      # Until the first images are committed there is nothing to compare;
      # once some exist, a test whose image is missing fails.
      - name: Compare golden images
        if: matrix.name == 'lower bound' && !inputs.update-goldens
        run: |
          if ! ls test/golden/goldens/*.png >/dev/null 2>&1; then
            echo "::warning::No golden images yet: dispatch this workflow with update-goldens."
            exit 0
          fi
          flutter test --tags golden

      - name: Upload golden differences
        if: failure() && matrix.name == 'lower bound'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failures
          path: packages/flutter/test/golden/failures/
          retention-days: 7

  # Writes the golden images with the lower bound's pinned Flutter, the
  # version the comparison above runs, and pushes them to their own branch.
  goldens-update:
    name: Update golden images
    if: inputs.update-goldens
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate golden images
        run: flutter test --update-goldens --tags golden

      - name: Push the images to the test/flutter-golden-images branch
        run: |
          git config user.name "dr2madre"
          git config user.email "48051639+dr2madre@users.noreply.github.com"
          images='test/golden/goldens'
          if [ -z "$(git status --porcelain --untracked-files=all -- "$images")" ]; then
            echo "Golden images unchanged; nothing to push."
            exit 0
          fi
          git checkout -B test/flutter-golden-images
          git add -- "$images"
          git commit -m "test(flutter): refresh golden images from the pinned Flutter"
          git push --force origin test/flutter-golden-images

  # Blocks (ADR 0017, amended): a parity checklist checked against an older
  # state of its reference component than the one on this branch fails the
  # job. An exception needs an entry with its reason in
  # packages/flutter/parity/drift-exceptions.json.
  parity-drift:
    name: Parity drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Compare each checklist with its reference
        working-directory: .
        run: node scripts/check-parity-drift.mjs
