name: Flutter

# The Flutter package's own checks (ADR 0017). Separate from ci.yml, which
# scripts/gate.test.mjs holds to one job; the token staleness check stays in
# the gate, since it needs no Flutter.
#
# Two Flutter versions: the package's lower bound (Flutter 3.35, Dart 3.9) and
# the current stable. The widget previews use preview groups, which arrived
# after Flutter 3.35, so the lower-bound job analyzes lib/ and test/ only.
#
# Golden tests (tag `golden`) compare pixels, and text renders differently on
# each operating system and Flutter version. They run in the lower-bound job
# only, on Linux with the pinned Flutter, against images that job produced.
# To (re)generate the images, dispatch this workflow with `update-goldens`:
# it pushes them to the `test/flutter-golden-images` branch, ready for a pull
# request. See docs/visual-testing.md.

