  pull_request:
    paths:
      - "packages/flutter/**"
      - "packages/tokens/**"
      - "packages/svelte/style-dictionary.config.mjs"
      - "scripts/tokens-dart-format.mjs"
      - "scripts/check-parity-drift.mjs"
