[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invisible-ui"
version = "0.1.0a0"
description = "Reflex (Python) adapter for the design system: thin wrappers over the @design-system/react components."
readme = "README.md"
license = { text = "EUPL-1.2" }
requires-python = ">=3.10"
dependencies = ["reflex>=0.9,<1.0"]

[project.urls]
Repository = "https://github.com/dr2madre/design-system"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["invisible_ui*"]
